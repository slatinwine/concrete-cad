<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清水 CAD · CONCRETE CAD</title>
<style>
:root{
  --bg:#75756f;
  --slab1:#a6a6a1; --slab2:#9a9a95; --slab3:#8d8d88;
  --edge:#585853; --edge2:#6d6d67;
  --ink:#23231f; --ink2:#3c3c36;
  --paper:#c9c9c4;
  --accent:#d9480f; --ok:#2b8a3e;
  --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  --noise:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.18 0 0 0 0 0.18 0 0 0 0 0.16 0 0 0 0.55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:13px;
}
#app{height:100vh;display:flex;flex-direction:column}

/* ---- 清水混凝土板 ---- */
.slab{
  position:relative;
  background:linear-gradient(180deg,var(--slab1) 0%,var(--slab2) 55%,var(--slab3) 100%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.16), 0 1px 2px rgba(0,0,0,.25);
}
.slab::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:var(--noise);opacity:.5;
}
/* 对拉螺栓孔（蝉孔） */
.holes-t::before,.holes-b::after,.holes-v::before{
  content:"";position:absolute;pointer-events:none;
  background:
    radial-gradient(circle 3px at 13px 50%,#45453f 0 2.1px,#78786f 2.5px 3.4px,transparent 3.8px) no-repeat,
    radial-gradient(circle 3px at calc(100% - 13px) 50%,#45453f 0 2.1px,#78786f 2.5px 3.4px,transparent 3.8px) no-repeat;
}
.holes-t::before{top:6px;left:0;right:0;height:9px}
.holes-b::after{bottom:6px;left:0;right:0;height:9px}
.holes-v::before{left:6px;top:0;bottom:0;width:9px;
  background:
    radial-gradient(circle 3px at 50% 14px,#45453f 0 2.1px,#78786f 2.5px 3.4px,transparent 3.8px) no-repeat,
    radial-gradient(circle 3px at 50% calc(100% - 14px),#45453f 0 2.1px,#78786f 2.5px 3.4px,transparent 3.8px) no-repeat;
}

/* ---- 顶栏 ---- */
#topbar{
  height:54px;display:flex;align-items:stretch;gap:8px;padding:7px 10px;
  border-left:none;border-right:none;border-top:none;
  background:linear-gradient(180deg,#8f8f8a,#82827d);
}
#brand{
  display:flex;align-items:center;padding:0 16px 0 12px;margin:0 2px 0 0;min-width:0;
  background:linear-gradient(180deg,#33332e,#232320);border:1px solid #131311;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.4);
}
#brand .mark{width:14px;height:14px;background:var(--accent);display:inline-block;margin-right:10px;box-shadow:0 0 0 1px #00000066, inset 0 0 0 1px #ffffff33}
#brand b{color:#ecece6;font-size:15px;letter-spacing:2px;display:block;line-height:1.15}
#brand i{color:#9b9b93;font-style:normal;font-size:9px;letter-spacing:2.2px;font-family:var(--mono);display:block;margin-top:2px}
.tgroup{display:flex;align-items:center;padding:0 6px;gap:4px}
.tgroup.sep{margin-left:auto}

.btn{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 10px;border:1px solid var(--edge2);
  background:linear-gradient(180deg,#adada8,#9c9c97);
  color:var(--ink);font-size:12.5px;font-family:inherit;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 1px rgba(0,0,0,.18);
  letter-spacing:.5px;white-space:nowrap;
}
.btn:hover{background:linear-gradient(180deg,#b8b8b3,#a4a49f)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.btn svg{width:16px;height:16px;flex:none}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.on{background:linear-gradient(180deg,#3a3a34,#2c2c28);color:#ecece6;border-color:#151513}
.btn.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}

/* 下拉菜单 */
.menu{position:relative}
.mitems{
  display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:190px;
  padding:5px;
}
.menu.open .mitems{display:flex;flex-direction:column}
.mitems .mi{
  padding:8px 12px;cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;gap:14px;
  border:1px solid transparent;
}
.mitems .mi:hover{background:#33332e;color:#ecece6;border-color:#151513}
.mitems .mi small{color:#8f8f88;font-family:var(--mono);font-size:10.5px}
.mitems .mi:hover small{color:#b9b9b2}

/* ---- 主区 ---- */
#main{flex:1;display:flex;min-height:0}
#rail{
  width:52px;display:flex;flex-direction:column;align-items:center;
  padding:26px 0 34px;gap:3px;border-top:none;border-bottom:none;border-left:none;flex:none;
}
.tool{
  position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--edge2);background:linear-gradient(180deg,#adada8,#9c9c97);
  color:var(--ink2);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
}
.tool:hover{background:linear-gradient(180deg,#b8b8b3,#a4a49f);color:var(--ink)}
.tool svg{width:20px;height:20px}
.tool.on{background:linear-gradient(180deg,#3a3a34,#2c2c28);color:#ecece6;border-color:#151513}
.tool.on::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--accent)}
.railsep{width:26px;height:1px;background:#6a6a64;margin:6px 0;box-shadow:0 1px 0 rgba(255,255,255,.25)}

#cwrap{flex:1;position:relative;min-width:0;background:var(--paper);border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none}
#grain{position:absolute;inset:0;pointer-events:none;background-image:var(--noise);opacity:.5}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(30,30,25,.14) 100%)}
#drophint{
  position:absolute;inset:14px;display:none;align-items:center;justify-content:center;
  border:3px dashed var(--accent);background:rgba(201,201,196,.82);
  font-size:20px;letter-spacing:6px;color:var(--accent);pointer-events:none;z-index:40;
}
#drophint.show{display:flex}
#tedit{
  position:absolute;display:none;z-index:45;width:280px;
  font-family:var(--mono);font-size:14px;color:var(--ink);
  background:rgba(245,245,240,.94);border:1px solid var(--ink);outline:2px solid var(--accent);
  padding:5px 8px;user-select:text;-webkit-user-select:text;
}

/* ---- 侧栏 ---- */
#side{
  width:272px;flex:none;display:flex;flex-direction:column;
  border-top:none;border-bottom:none;border-right:none;min-height:0;
}
.pane{padding:12px 12px 10px;border-bottom:1px solid #6f6f69;box-shadow:0 1px 0 rgba(255,255,255,.22)}
.pane h3{
  font-size:11px;letter-spacing:3px;color:var(--ink2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid #6f6f69;padding-bottom:6px;box-shadow:0 1px 0 rgba(255,255,255,.2);
}
.pane h3 span{font-family:var(--mono);font-size:9px;color:#6f6f68;letter-spacing:2px}
#pane-props{flex:1;overflow-y:auto;min-height:0}
.frow{display:flex;align-items:center;margin-bottom:6px;gap:6px}
.frow label{flex:none;width:78px;font-size:11.5px;color:#43443d}
.frow input[type=text],.frow input[type=number],.frow select{
  flex:1;min-width:0;height:26px;padding:0 7px;border:1px solid #63635d;background:#b9b9b3;
  font-family:var(--mono);font-size:12px;color:var(--ink);user-select:text;-webkit-user-select:text;
}
.frow input:focus,.frow select:focus{outline:1.5px solid var(--accent);background:#cfcec8}
.frow .ro{background:transparent;border-style:dashed;border-color:#7d7d76;color:#55564e}
.ops{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.ops .btn{height:28px;font-size:11.5px;padding:0 9px}
.ptitle{font-family:var(--mono);font-size:11px;color:#6b3315;background:rgba(217,72,15,.1);border-left:3px solid var(--accent);padding:4px 8px;margin-bottom:9px;letter-spacing:1px}
.note{font-size:11px;color:#5d5e55;line-height:1.6;margin-top:8px}

.lrow{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;cursor:pointer;margin-bottom:3px}
.lrow:hover{background:rgba(255,255,255,.14)}
.lrow.act{background:#33332e;border-color:#151513;color:#ecece6}
.lrow.off .lname{opacity:.4;text-decoration:line-through}
.ldot{width:14px;height:14px;border:1px solid #00000055;cursor:pointer;flex:none;box-shadow:inset 0 0 0 1.5px #ffffff33}
.lname{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname input{width:100%;font:inherit;border:1px solid var(--accent);background:#cfcec8;padding:1px 4px;user-select:text}
.lb{width:22px;height:22px;border:none;background:none;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;opacity:.75}
.lb:hover{opacity:1}
.lb svg{width:14px;height:14px}
#ladd{width:100%;margin-top:6px;justify-content:center}

#tblock{border-bottom:none;margin-top:auto;padding:10px 12px 14px}
#tblock table{width:100%;border-collapse:collapse;font-size:11px}
#tblock td{border:1px solid #6f6f69;padding:4px 7px;color:#43443d}
#tblock td.k{width:52px;background:rgba(0,0,0,.05);letter-spacing:2px}
#tblock td.v{font-family:var(--mono);color:var(--ink)}

/* ---- 状态栏 ---- */
#status{
  height:30px;display:flex;align-items:center;gap:14px;padding:0 14px;
  font-family:var(--mono);font-size:11.5px;color:#2d2d28;
  border-left:none;border-right:none;border-bottom:none;white-space:nowrap;overflow:hidden;
}
#status .sep{color:#6c6c65}
#status .dim{color:#5d5e55}
#sxy{min-width:170px}
#stool{font-family:"Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:1px}
#thint{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#5d5e55;overflow:hidden;text-overflow:ellipsis;flex:1}
.lamp{display:inline-flex;align-items:center;gap:5px}
.lamp i{width:8px;height:8px;border-radius:50%;background:#5a5a53;box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.lamp.on i{background:var(--ok);box-shadow:0 0 4px rgba(43,138,62,.8)}

/* ---- Toast ---- */
#toasts{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{
  background:#26261f;color:#ecece6;padding:8px 18px;font-size:12.5px;letter-spacing:1px;
  border:1px solid #101010;border-left:3px solid var(--accent);
  box-shadow:0 3px 10px rgba(0,0,0,.4);opacity:0;transition:opacity .18s;
}
.toast.show{opacity:1}

/* ---- 模态 ---- */
#mback{position:fixed;inset:0;background:rgba(28,28,24,.45);z-index:90;display:none;align-items:center;justify-content:center}
#mback.show{display:flex}
#modal{max-width:380px;padding:0}
#modal .mhead{padding:10px 16px;border-bottom:1px solid var(--edge);font-size:12px;letter-spacing:3px;background:rgba(0,0,0,.06)}
#modal .mbody{padding:18px 16px;font-size:13px;line-height:1.7}
#modal .mfoot{padding:10px 16px 14px;display:flex;justify-content:flex-end;gap:8px}
.btn.pri{background:linear-gradient(180deg,#3a3a34,#2c2c28);color:#ecece6;border-color:#151513}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#8a8a85}
::-webkit-scrollbar-thumb{background:#55554f;border:1px solid #3d3d38;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="slab">
    <div id="brand" class="holes-v"><span class="mark"></span><div><b>清水 CAD</b><i>CONCRETE DRAFTING BOARD</i></div></div>

    <div class="tgroup slab holes-t">
      <button class="btn" id="b-new" title="新建（清空图纸）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg>新建</button>
      <button class="btn" id="b-open" title="打开 / 导入（JSON · SVG · DXF）Ctrl+O">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h6l2 2h10v11H3z"/></svg>打开</button>
      <div class="menu" id="m-export">
        <button class="btn" title="导出"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 14V3m0 0L8 7m4-4l4 4M4 19h16"/></svg>导出 ▾</button>
        <div class="mitems slab holes-b">
          <div class="mi" data-x="svg">SVG 矢量图 <small>.svg</small></div>
          <div class="mi" data-x="dxf">DXF CAD 交换 <small>.dxf</small></div>
          <div class="mi" data-x="png">PNG 位图 <small>.png</small></div>
          <div class="mi" data-x="json">工程文件 <small>.json</small></div>
        </div>
      </div>
    </div>

    <div class="tgroup slab holes-t">
      <button class="btn icon" id="b-undo" title="撤销 Ctrl+Z"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 4L3 8l4 4"/><path d="M3 8h11a6 6 0 0 1 6 6v2"/></svg></button>
      <button class="btn icon" id="b-redo" title="重做 Ctrl+Y"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 4l4 4-4 4"/><path d="M21 8H10a6 6 0 0 0-6 6v2"/></svg></button>
    </div>

    <div class="tgroup slab holes-t">
      <button class="btn on" id="t-osnap" title="对象捕捉 F3（端点/中点/圆心/象限）">捕捉</button>
      <button class="btn" id="t-ortho" title="正交 F8">正交</button>
      <button class="btn" id="t-gsnap" title="栅格捕捉 F9">格捕</button>
      <button class="btn on" id="t-grid" title="栅格显示 F7">栅格</button>
    </div>

    <div class="tgroup slab holes-t">
      <button class="btn icon" id="b-zo" title="缩小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="7"/><path d="M7.8 10.5h5.4M16 16l5 5"/></svg></button>
      <button class="btn icon" id="b-fit" title="显示全部 F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn icon" id="b-zi" title="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="7"/><path d="M7.8 10.5h5.4M10.5 7.8v5.4M16 16l5 5"/></svg></button>
    </div>

    <div class="tgroup sep" style="border:none;background:none;box-shadow:none;padding-right:2px">
      <span style="font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:#4b4b45;text-align:right;line-height:1.7">RAW&nbsp;CONCRETE<br>UNIT&nbsp;·&nbsp;MM</span>
    </div>
  </header>

  <div id="main">
    <nav id="rail" class="slab holes-v">
      <button class="tool on" data-tool="select" title="选择 · Esc — 点选/框选/拖动/夹点编辑">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8-6.2 1.6L10 20z"/></svg></button>
      <button class="tool" data-tool="pan" title="平移 · H（或中键拖拽）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2v20M2 12h20M12 2L9 5m3-3l3 3M12 22l-3-3m3 3l3-3M2 12l3-3m-3 3l3 3M22 12l-3-3m3 3l-3 3"/></svg></button>
      <div class="railsep"></div>
      <button class="tool" data-tool="line" title="直线 · L">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 19L19 5"/><rect x="2.5" y="16.5" width="5" height="5" fill="currentColor" stroke="none"/><rect x="16.5" y="2.5" width="5" height="5" fill="currentColor" stroke="none"/></svg></button>
      <button class="tool" data-tool="pline" title="多段线 · P（Enter/双击结束，C 闭合）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 20l5-9 5 4 8-11"/><circle cx="3" cy="20" r="1.8" fill="currentColor" stroke="none"/><circle cx="8" cy="11" r="1.8" fill="currentColor" stroke="none"/><circle cx="13" cy="15" r="1.8" fill="currentColor" stroke="none"/><circle cx="21" cy="4" r="1.8" fill="currentColor" stroke="none"/></svg></button>
      <button class="tool" data-tool="rect" title="矩形 · R">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="6" width="16" height="12"/></svg></button>
      <button class="tool" data-tool="circle" title="圆 · C">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="tool" data-tool="arc" title="圆弧 · A（圆心→起点→终点）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19a15 15 0 0 1 15-15"/><circle cx="4" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg></button>
      <button class="tool" data-tool="ellipse" title="椭圆 · E（圆心→半轴→半短轴）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="12" rx="9" ry="5.5" transform="rotate(-18 12 12)"/></svg></button>
      <button class="tool" data-tool="text" title="文字 · T">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg></button>
      <button class="tool" data-tool="dim" title="对齐标注 · D（两点+偏移侧）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 17h16M4 14v6M20 14v6M7 15l-3 2 3 2M17 15l3 2-3 2"/></svg></button>
    </nav>

    <div id="cwrap">
      <canvas id="cv"></canvas>
      <div id="grain"></div>
      <div id="vig"></div>
      <input id="tedit" type="text" placeholder="输入文字… Enter 确认 / Esc 取消">
      <div id="drophint">松开以导入 · SVG / DXF / JSON</div>
    </div>

    <aside id="side" class="slab holes-t">
      <section class="pane">
        <h3>图层 <span>LAYERS</span></h3>
        <div id="llist"></div>
        <button class="btn" id="ladd">＋ 新建图层</button>
      </section>
      <section class="pane" id="pane-props">
        <h3>属性 <span>PROPERTIES</span></h3>
        <div id="props"></div>
      </section>
      <section class="pane" id="tblock">
        <table>
          <tr><td class="k">图名</td><td class="v" id="tb-name">未命名</td></tr>
          <tr><td class="k">单位</td><td class="v">mm</td></tr>
          <tr><td class="k">实体</td><td class="v" id="tb-count">0</td></tr>
          <tr><td class="k">日期</td><td class="v" id="tb-date"></td></tr>
          <tr><td class="k">版本</td><td class="v">清水 CAD v1.0</td></tr>
        </table>
      </section>
    </aside>
  </div>

  <footer id="status" class="slab">
    <span id="sxy">X 0.00 · Y 0.00</span>
    <span class="sep">|</span>
    <span id="sdelta" class="dim"></span>
    <span class="sep">|</span>
    <span id="stool">选择</span>
    <span id="thint">单击选择 · 框选 · 拖动移动 · 双击文字编辑</span>
    <span class="lamp" id="lamp-o"><i></i>捕</span>
    <span class="lamp" id="lamp-g"><i></i>格</span>
    <span class="lamp" id="lamp-r"><i></i>正交</span>
    <span class="sep">|</span>
    <span id="sgrid">栅格 10</span>
    <span class="sep">|</span>
    <span id="szoom">100%</span>
    <span class="sep">|</span>
    <span id="scount">实体 0</span>
  </footer>
</div>

<script>
'use strict';
/* ============================================================
   清水 CAD — 单文件 CAD 编辑器
   实体：line / pline / rect / circle / arc / ellipse / text / dim
   ============================================================ */

/* ---------- 基础工具 ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=n=>!isFinite(n)?'0.00':(Math.abs(n)<1e-9?0:n).toFixed(2);
const D2R=Math.PI/180, R2D=180/Math.PI;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const INK='#262620', ACCENT='#d9480f', PAPER='#c9c9c4';
const PALETTE=['#33322e','#d9480f','#2b8a3e','#1864ab','#8a5a2b','#86867f'];
const ACI={'#33322e':7,'#d9480f':30,'#2b8a3e':3,'#1864ab':5,'#8a5a2b':32,'#86867f':8};
const ACI2C={7:'#33322e',30:'#d9480f',3:'#2b8a3e',5:'#1864ab',32:'#8a5a2b',8:'#86867f'};
const FONT='Consolas,"Microsoft YaHei",monospace';

/* ---------- 状态 ---------- */
let doc=null;
let view={scale:2,ox:260,oy:520};
let settings={grid:10,textH:16,dimTs:10,osnap:true,gsap:false,ortho:false,gridshow:true};
let sel=new Set(), hoverId=null, tool='select', draft=null, clipboard=null;
let filename='未命名';
let curSnap=null, curWp={x:0,y:0};
let mouseS={x:0,y:0}, mouseOn=false, mouseDownS=null, spaceDown=false;
let drag=null, gripHover=null;
let hist=[], fut=[];

function defLayers(){return [
  {name:'1-墙体',color:'#33322e',visible:true,locked:false},
  {name:'2-标注',color:'#d9480f',visible:true,locked:false},
  {name:'3-文字',color:'#1864ab',visible:true,locked:false},
  {name:'4-辅助',color:'#86867f',visible:true,locked:false}];}
function blankDoc(){doc={seq:1,entities:[],layers:defLayers(),activeLayer:'1-墙体'};}
function L(name){return doc.layers.find(l=>l.name===name);}
function Lc(name){const l=L(name);return l?l.color:INK;}
function visible(e){const l=L(e.layer);return l?l.visible:true;}
function editable(e){const l=L(e.layer);return l&&l.visible&&!l.locked;}
function byId(id){return doc.entities.find(e=>e.id===id);}
function visibleEnts(){return doc.entities.filter(visible);}
function selEnts(){return [...sel].map(byId).filter(Boolean);}
function addEnt(o){o.id='E'+(doc.seq++);if(!o.layer)o.layer=doc.activeLayer;doc.entities.push(o);return o;}

/* ---------- 示例图纸 ---------- */
function seed(){
  blankDoc();
  addEnt({type:'rect',pts:[{x:0,y:0},{x:240,y:160}],layer:'1-墙体'});
  addEnt({type:'rect',pts:[{x:8,y:8},{x:232,y:152}],layer:'1-墙体'});
  addEnt({type:'line',pts:[{x:60,y:0},{x:60,y:40}],layer:'4-辅助'});
  addEnt({type:'arc',pts:[{x:60,y:0}],r:40,a0:Math.PI/2,a1:Math.PI,layer:'4-辅助'});
  for(const p of [[20,20],[220,20],[20,140],[220,140]])
    addEnt({type:'circle',pts:[{x:p[0],y:p[1]}],r:8,layer:'1-墙体'});
  addEnt({type:'dim',pts:[{x:0,y:0},{x:240,y:0}],off:-26,layer:'2-标注',ts:12});
  addEnt({type:'dim',pts:[{x:240,y:0},{x:240,y:160}],off:26,layer:'2-标注',ts:12});
  addEnt({type:'text',pts:[{x:120,y:190}],text:'清水混凝土',size:22,rot:0,layer:'3-文字'});
  addEnt({type:'text',pts:[{x:120,y:172}],text:'RAW CONCRETE CAD — 1:50',size:8,rot:0,layer:'3-文字'});
}

/* ---------- 视图变换 ---------- */
const cv=$('#cv'), ctx=cv.getContext('2d');
let dpr=1, CW=100, CH=100;
const S2W=(sx,sy)=>({x:(sx-view.ox)/view.scale, y:(view.oy-sy)/view.scale});
const W2S=(wx,wy)=>({x:wx*view.scale+view.ox, y:view.oy-wy*view.scale});
function resize(){dpr=window.devicePixelRatio||1;CW=cv.clientWidth||100;CH=cv.clientHeight||100;
  cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr);requestRender();}
function zoomAt(sx,sy,k){const w=S2W(sx,sy);view.scale=clamp(view.scale*k,0.02,4000);
  view.ox=sx-w.x*view.scale;view.oy=sy+w.y*view.scale;updateStatusZoom();requestRender();saveViewDeb();}
function docBBox(){return allBBox(visibleEnts());}
function allBBox(ents){let bb=null;for(const e of ents){const b=entBBox(e);if(!b)continue;
  if(!bb)bb={minx:b.minx,miny:b.miny,maxx:b.maxx,maxy:b.maxy};
  else{bb.minx=Math.min(bb.minx,b.minx);bb.miny=Math.min(bb.miny,b.miny);
    bb.maxx=Math.max(bb.maxx,b.maxx);bb.maxy=Math.max(bb.maxy,b.maxy);}}
  return bb;}
function fitView(){const bb=docBBox()||{minx:0,miny:0,maxx:300,maxy:200};
  const w=Math.max(1e-6,bb.maxx-bb.minx),h=Math.max(1e-6,bb.maxy-bb.miny);
  const k=Math.min(CW/(w*1.28),CH/(h*1.28));
  view.scale=clamp(k,0.02,4000);
  view.ox=(CW-(bb.minx+bb.maxx)*view.scale)/2;
  view.oy=(CH+(bb.miny+bb.maxy)*view.scale)/2;
  updateStatusZoom();requestRender();saveViewDeb();}
function gridStep(){let s=settings.grid;while(s*view.scale<9)s*=10;while(s*view.scale>140)s/=10;return s;}

/* ---------- 实体几何 ---------- */
function rectCorners(e){const a=e.pts[0],b=e.pts[1];
  return[{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y)},{x:Math.max(a.x,b.x),y:Math.min(a.y,b.y)},
         {x:Math.max(a.x,b.x),y:Math.max(a.y,b.y)},{x:Math.min(a.x,b.x),y:Math.max(a.y,b.y)}];}
function entBBox(e){
  switch(e.type){
    case'line':case'pline':case'rect':{
      const pts=e.type==='rect'?rectCorners(e):e.pts;if(!pts.length)return null;
      let bb={minx:1e18,miny:1e18,maxx:-1e18,maxy:-1e18};
      for(const p of pts){bb.minx=Math.min(bb.minx,p.x);bb.maxx=Math.max(bb.maxx,p.x);
        bb.miny=Math.min(bb.miny,p.y);bb.maxy=Math.max(bb.maxy,p.y);}return bb;}
    case'circle':{const c=e.pts[0];return{minx:c.x-e.r,miny:c.y-e.r,maxx:c.x+e.r,maxy:c.y+e.r};}
    case'arc':{const c=e.pts[0];return{minx:c.x-e.r,miny:c.y-e.r,maxx:c.x+e.r,maxy:c.y+e.r};}
    case'ellipse':{const c=e.pts[0];const m=Math.max(e.rx,e.ry);
      return{minx:c.x-m,miny:c.y-m,maxx:c.x+m,maxy:c.y+m};}
    case'text':{const p=e.pts[0],w=textWidth(e);
      return{minx:p.x-w*.05,miny:p.y-e.size*.25,maxx:p.x+w*1.05,maxy:p.y+e.size};}
    case'dim':{const d=dimGeom(e);const pts=[e.pts[0],e.pts[1],d.A,d.B];let bb={minx:1e18,miny:1e18,maxx:-1e18,maxy:-1e18};
      for(const p of pts){bb.minx=Math.min(bb.minx,p.x);bb.maxx=Math.max(bb.maxx,p.x);
        bb.miny=Math.min(bb.miny,p.y);bb.maxy=Math.max(bb.maxy,p.y);}
      const ts=e.ts||settings.dimTs;
      bb.minx-=ts;bb.miny-=ts;bb.maxx+=ts;bb.maxy+=ts;return bb;}
  }return null;}
function textWidth(e){let w=0;for(const ch of e.text)w+=ch.charCodeAt(0)>0x2E80?e.size:e.size*0.62;return w;}
function entLength(e){
  switch(e.type){
    case'line':return dist(e.pts[0],e.pts[1]);
    case'rect':{const a=e.pts[0],b=e.pts[1];return 2*(Math.abs(b.x-a.x)+Math.abs(b.y-a.y));}
    case'pline':{let s=0;for(let i=0;i<e.pts.length-1;i++)s+=dist(e.pts[i],e.pts[i+1]);
      if(e.closed&&e.pts.length>2)s+=dist(e.pts[e.pts.length-1],e.pts[0]);return s;}
    case'circle':return 2*Math.PI*e.r;
    case'arc':return e.r*(e.a1-e.a0);
    case'ellipse':{const a=e.rx,b=e.ry;return Math.PI*(3*(a+b)-Math.sqrt((3*a+b)*(a+3*b)));}
    case'dim':return dist(e.pts[0],e.pts[1]);
  }return 0;}
function entArea(e){
  const poly=e.type==='rect'?rectCorners(e):(e.type==='pline'&&e.closed?e.pts:null);
  if(!poly)return null;let s=0;
  for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];s+=p.x*q.y-q.x*p.y;}
  return Math.abs(s)/2;}
function distPtSeg(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
  if(l2<1e-12)return dist(p,a);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2;t=clamp(t,0,1);
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));}
function entHit(e,p,tol){
  switch(e.type){
    case'line':return distPtSeg(p,e.pts[0],e.pts[1])<tol;
    case'rect':{const c=rectCorners(e);for(let i=0;i<4;i++)if(distPtSeg(p,c[i],c[(i+1)%4])<tol)return true;return false;}
    case'pline':{for(let i=0;i<e.pts.length-1;i++)if(distPtSeg(p,e.pts[i],e.pts[i+1])<tol)return true;
      if(e.closed&&e.pts.length>2&&distPtSeg(p,e.pts[e.pts.length-1],e.pts[0])<tol)return true;return false;}
    case'circle':return Math.abs(dist(p,e.pts[0])-e.r)<tol;
    case'arc':{const c=e.pts[0],d=dist(p,c);
      if(Math.abs(d-e.r)>tol)return false;
      let a=Math.atan2(p.y-c.y,p.x-c.x);let a0=e.a0,a1=e.a1;
      while(a<a0)a+=2*Math.PI;return a<=a1+tol/Math.max(e.r,1e-6);}
    case'ellipse':{const c=e.pts[0];const co=Math.cos(-(e.rot||0)),si=Math.sin(-(e.rot||0));
      const dx=p.x-c.x,dy=p.y-c.y;const ex=dx*co-dy*si,ey=dx*si+dy*co;
      const t=Math.hypot(ex/(e.rx||1e-9),ey/(e.ry||1e-9));
      return Math.abs(t-1)*((e.rx+e.ry)/2)<tol;}
    case'text':{const b=e.pts[0],w=textWidth(e),co=Math.cos(-(e.rot||0)),si=Math.sin(-(e.rot||0));
      const dx=p.x-b.x,dy=p.y-b.y;const lx=dx*co-dy*si,ly=dx*si+dy*co;
      return lx>=-w*.1&&lx<=w*1.05&&ly>=-e.size*.3&&ly<=e.size*1.05;}
    case'dim':{const d=dimGeom(e);
      return distPtSeg(p,e.pts[0],d.A)<tol||distPtSeg(p,e.pts[1],d.B)<tol||distPtSeg(p,d.A,d.B)<tol;}
  }return false;}
function hitTop(wp){const tol=7/view.scale;
  for(let i=doc.entities.length-1;i>=0;i--){const e=doc.entities[i];
    if(!editable(e))continue;if(entHit(e,wp,tol))return e;}return null;}

/* ---------- 标注几何 ---------- */
function dimGeom(e){
  const p1=e.pts[0],p2=e.pts[1];
  let ux=p2.x-p1.x,uy=p2.y-p1.y;const len=Math.hypot(ux,uy)||1e-9;ux/=len;uy/=len;
  const nx=-uy,ny=ux,off=e.off||0;
  return{A:{x:p1.x+nx*off,y:p1.y+ny*off},B:{x:p2.x+nx*off,y:p2.y+ny*off},
    nx,ny,ux,uy,L:len,ang:Math.atan2(uy,ux)};}

/* ---------- 实体变换 ---------- */
function translateEnt(e,dx,dy){for(const p of e.pts){p.x+=dx;p.y+=dy;}}
function selCenter(){const bb=selBBox();return bb?{x:(bb.minx+bb.maxx)/2,y:(bb.miny+bb.maxy)/2}:{x:0,y:0};}
function selBBox(){return allBBox(selEnts());}
function rot90Sel(){const c=selCenter();pushHistory();
  const rot90=p=>{const nx=c.x-(p.y-c.y),ny=c.y+(p.x-c.x);p.x=nx;p.y=ny;};
  for(const e of selEnts()){
    if(e.type==='arc'){rot90(e.pts[0]);e.a0+=Math.PI/2;e.a1+=Math.PI/2;}
    else if(e.type==='ellipse'){rot90(e.pts[0]);
      e.rot=(e.rot||0)+Math.PI/2;const t=e.rx;e.rx=e.ry;e.ry=t;}
    else if(e.type==='circle')rot90(e.pts[0]);
    else if(e.type==='text'){rot90(e.pts[0]);e.rot=(e.rot||0)+Math.PI/2;}
    else for(const p of e.pts)rot90(p);
  }refreshAll();}
function mirrorSel(axis){ // axis: 'h' 左右镜像(flip x), 'v' 上下镜像(flip y)
  const bb=selBBox()||{minx:0,maxx:0,miny:0,maxy:0};
  const cx=(bb.minx+bb.maxx)/2, cy=(bb.miny+bb.maxy)/2;
  pushHistory();
  for(const e of selEnts()){
    for(const p of e.pts){if(axis==='h')p.x=2*cx-p.x;else p.y=2*cy-p.y;}
    if(e.type==='arc'){const a0=Math.PI-e.a1,a1=Math.PI-e.a0;
      if(axis==='v'){e.a0=-e.a1;e.a1=-e.a0;}else{e.a0=a0;e.a1=a1;}}
    if(e.type==='ellipse'||e.type==='text')e.rot=axis==='h'?Math.PI-(e.rot||0):-(e.rot||0);
    if(e.type==='dim')e.off=-(e.off||0);
  }refreshAll();}

/* ---------- 捕捉 ---------- */
function snapPts(e){
  const out=[];const P=(x,y,kind,label)=>out.push({p:{x,y},kind,label});
  switch(e.type){
    case'line':{const a=e.pts[0],b=e.pts[1];
      P(a.x,a.y,'end','端点');P(b.x,b.y,'end','端点');
      P((a.x+b.x)/2,(a.y+b.y)/2,'mid','中点');break;}
    case'rect':{const c=rectCorners(e);
      for(let i=0;i<4;i++){P(c[i].x,c[i].y,'end','端点');
        const q=c[(i+1)%4];P((c[i].x+q.x)/2,(c[i].y+q.y)/2,'mid','中点');}break;}
    case'pline':{for(let i=0;i<e.pts.length;i++){const p=e.pts[i];P(p.x,p.y,'end','端点');
        if(i<e.pts.length-1){const q=e.pts[i+1];P((p.x+q.x)/2,(p.y+q.y)/2,'mid','中点');}}break;}
    case'circle':{const c=e.pts[0];P(c.x,c.y,'cen','圆心');
      for(let k=0;k<4;k++){const a=k*Math.PI/2;P(c.x+e.r*Math.cos(a),c.y+e.r*Math.sin(a),'qua','象限');}break;}
    case'arc':{const c=e.pts[0];P(c.x,c.y,'cen','圆心');
      P(c.x+e.r*Math.cos(e.a0),c.y+e.r*Math.sin(e.a0),'end','端点');
      P(c.x+e.r*Math.cos(e.a1),c.y+e.r*Math.sin(e.a1),'end','端点');
      {const m=(e.a0+e.a1)/2;P(c.x+e.r*Math.cos(m),c.y+e.r*Math.sin(m),'mid','中点');}break;}
    case'ellipse':{const c=e.pts[0];P(c.x,c.y,'cen','圆心');break;}
    case'text':{P(e.pts[0].x,e.pts[0].y,'end','基点');break;}
    case'dim':{P(e.pts[0].x,e.pts[0].y,'end','标注点');P(e.pts[1].x,e.pts[1].y,'end','标注点');break;}
  }return out;}
function findSnap(wp){
  if(!settings.osnap)return null;
  const tolW=9/view.scale;let best=null;
  for(const e of visibleEnts()){if(!editable(e))continue;
    for(const c of snapPts(e)){const d=dist(c.p,wp);
      if(d<tolW&&(!best||d<best.d))best={d,p:{x:c.p.x,y:c.p.y},kind:c.kind,label:c.label};}}
  return best;}
function applySnapOrtho(raw,anchor){
  curSnap=findSnap(raw);
  let p=curSnap?{x:curSnap.p.x,y:curSnap.p.y}:raw;
  if(!curSnap&&settings.gsnap){const g=gridStep();p={x:Math.round(raw.x/g)*g,y:Math.round(raw.y/g)*g};}
  if(settings.ortho&&anchor){
    const dx=p.x-anchor.x,dy=p.y-anchor.y;
    if(Math.abs(dx)>Math.abs(dy))p={x:p.x,y:anchor.y};else p={x:anchor.x,y:p.y};}
  return p;}

/* ---------- 渲染 ---------- */
let dirty=true;
function requestRender(){dirty=true;}
(function frame(){if(dirty){dirty=false;try{paint();}catch(err){console.error(err);}}requestAnimationFrame(frame);})();

function paint(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,CW,CH);
  if(settings.gridshow)drawGrid();
  ctx.setTransform(view.scale*dpr,0,0,-view.scale*dpr,view.ox*dpr,view.oy*dpr);
  for(const e of visibleEnts()){
    const l=L(e.layer);const alpha=l&&l.locked?0.45:1;
    drawEnt(ctx,e,view.scale,Lc(e.layer),alpha);}
  if(hoverId&&tool==='select'&&!drag){const e=byId(hoverId);if(e&&editable(e))drawEnt(ctx,e,view.scale,ACCENT,0.5);}
  for(const id of sel){const e=byId(id);if(e&&visible(e))drawEnt(ctx,e,view.scale,ACCENT,0.95,2.4);}
  if(draft)drawDraft();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawGrips();drawSnapMark();drawRubber();drawCross();}

function drawGrid(){
  const gs=gridStep();
  const w0=S2W(0,CH),w1=S2W(CW,0);
  const x0=Math.floor(w0.x/gs)*gs,x1=Math.ceil(w1.x/gs)*gs;
  const y0=Math.floor(w0.y/gs)*gs,y1=Math.ceil(w1.y/gs)*gs;
  if((x1-x0)/gs>700||(y1-y0)/gs>700)return;
  ctx.lineWidth=1;
  const eps=gs*1e-6;
  for(let x=x0;x<=x1;x+=gs){const s=W2S(x,0).x;
    ctx.strokeStyle=Math.abs(x%(gs*10))<eps||Math.abs(Math.abs(x%(gs*10))-gs*10)<eps?'rgba(38,38,32,.17)':'rgba(38,38,32,.07)';
    ctx.beginPath();ctx.moveTo(s+.5,0);ctx.lineTo(s+.5,CH);ctx.stroke();}
  for(let y=y0;y<=y1;y+=gs){const s=W2S(0,y).y;
    ctx.strokeStyle=Math.abs(y%(gs*10))<eps||Math.abs(Math.abs(y%(gs*10))-gs*10)<eps?'rgba(38,38,32,.17)':'rgba(38,38,32,.07)';
    ctx.beginPath();ctx.moveTo(0,s+.5);ctx.lineTo(CW,s+.5);ctx.stroke();}
  ctx.strokeStyle='rgba(38,38,32,.38)';
  if(0>=w0.y&&0<=w1.y){const sy=W2S(0,0).y;ctx.beginPath();ctx.moveTo(0,sy+.5);ctx.lineTo(CW,sy+.5);ctx.stroke();}
  if(0>=w0.x&&0<=w1.x){const sx=W2S(0,0).x;ctx.beginPath();ctx.moveTo(sx+.5,0);ctx.lineTo(sx+.5,CH);ctx.stroke();}
  const o=W2S(0,0);
  ctx.strokeStyle='rgba(38,38,32,.6)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(o.x,o.y,5,0,7);ctx.moveTo(o.x-9,o.y);ctx.lineTo(o.x+9,o.y);
  ctx.moveTo(o.x,o.y-9);ctx.lineTo(o.x,o.y+9);ctx.stroke();}

function setStroke(g,color,alpha,scale,wpx){g.strokeStyle=color;g.globalAlpha=alpha;g.lineWidth=(wpx||1.25)/scale;g.lineCap='square';}
function drawEnt(g,e,scale,color,alpha,wpx){
  alpha=alpha===undefined?1:alpha;
  switch(e.type){
    case'line':{setStroke(g,color,alpha,scale,wpx);g.beginPath();
      g.moveTo(e.pts[0].x,e.pts[0].y);g.lineTo(e.pts[1].x,e.pts[1].y);g.stroke();break;}
    case'rect':{setStroke(g,color,alpha,scale,wpx);const c=rectCorners(e);g.beginPath();
      g.moveTo(c[0].x,c[0].y);for(let i=1;i<4;i++)g.lineTo(c[i].x,c[i].y);g.closePath();g.stroke();break;}
    case'pline':{if(e.pts.length<2)break;setStroke(g,color,alpha,scale,wpx);g.beginPath();
      g.moveTo(e.pts[0].x,e.pts[0].y);for(let i=1;i<e.pts.length;i++)g.lineTo(e.pts[i].x,e.pts[i].y);
      if(e.closed)g.closePath();g.stroke();break;}
    case'circle':{setStroke(g,color,alpha,scale,wpx);g.beginPath();
      g.arc(e.pts[0].x,e.pts[0].y,e.r,0,Math.PI*2);g.stroke();break;}
    case'arc':{setStroke(g,color,alpha,scale,wpx);g.beginPath();
      g.arc(e.pts[0].x,e.pts[0].y,e.r,e.a0,e.a1);g.stroke();break;}
    case'ellipse':{setStroke(g,color,alpha,scale,wpx);g.beginPath();
      g.ellipse(e.pts[0].x,e.pts[0].y,e.rx,e.ry,e.rot||0,0,Math.PI*2);g.stroke();break;}
    case'text':{g.save();g.translate(e.pts[0].x,e.pts[0].y);g.scale(1,-1);g.rotate(-(e.rot||0));
      g.fillStyle=color;g.globalAlpha=alpha;g.font=e.size+'px '+FONT;
      g.textBaseline='alphabetic';g.fillText(e.text,0,0);g.restore();break;}
    case'dim':drawDim(g,e,scale,color,alpha);break;
  }

function drawDim(g,e,scale,color,alpha){
  const ts=e.ts||settings.dimTs,d=dimGeom(e);
  const ext=0.35*ts;
  g.strokeStyle=color;g.globalAlpha=alpha;g.lineWidth=1.05/scale;g.lineCap='square';
  g.beginPath();
  g.moveTo(e.pts[0].x,e.pts[0].y);g.lineTo(d.A.x+d.nx*ext,d.A.y+d.ny*ext);
  g.moveTo(e.pts[1].x,e.pts[1].y);g.lineTo(d.B.x+d.nx*ext,d.B.y+d.ny*ext);
  g.moveTo(d.A.x,d.A.y);g.lineTo(d.B.x,d.B.y);g.stroke();
  const al=0.7*ts,aw=0.18*ts;
  g.fillStyle=color;
  const tri=(tip,dx,dy)=>{g.beginPath();g.moveTo(tip.x,tip.y);
    g.lineTo(tip.x+dx*al-dy*aw,tip.y+dy*al+dx*aw);
    g.lineTo(tip.x+dx*al+dy*aw,tip.y+dy*al-dx*aw);g.closePath();g.fill();};
  tri(d.A,-d.ux,-d.uy);tri(d.B,d.ux,d.uy);
  let ang=d.ang;const deg=((ang*R2D)%360+360)%360;
  if(deg>90&&deg<=270)ang+=Math.PI;
  const mx=(d.A.x+d.B.x)/2+d.nx*0.45*ts,my=(d.A.y+d.B.y)/2+d.ny*0.45*ts;
  g.save();g.translate(mx,my);g.scale(1,-1);g.rotate(-ang);
  g.font=ts+'px '+FONT;g.textAlign='center';g.fillText(fmt(d.L),0,0);
  g.textAlign='left';g.restore();g.globalAlpha=1;}

function drawDraft(){
  const a=draft.pts[draft.pts.length-1];
  const c=curWp;const s=view.scale;
  const guide=(p1,p2)=>{ctx.strokeStyle=ACCENT;ctx.globalAlpha=.55;ctx.lineWidth=.8/s;
    ctx.setLineDash([5/s,4/s]);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;};
  const ent=(o)=>drawEnt(ctx,o,s,ACCENT,1,1.6);
  if(tool==='line'&&draft.pts.length===1){guide(draft.pts[0],c);ent({type:'line',pts:[draft.pts[0],c]});}
  else if(tool==='rect'&&draft.pts.length===1){guide(draft.pts[0],c);ent({type:'rect',pts:[draft.pts[0],c]});}
  else if(tool==='circle'&&draft.pts.length===1){guide(draft.pts[0],c);
    ent({type:'circle',pts:[draft.pts[0]],r:Math.max(0.01,dist(draft.pts[0],c))});}
  else if(tool==='arc'){if(draft.pts.length===1){guide(draft.pts[0],c);}
    else if(draft.pts.length===2){const cc=draft.pts[0],r=dist(cc,draft.pts[1]);
      guide(cc,c);ent({type:'circle',pts:[cc],r:Math.max(0.01,r)});}}
  else if(tool==='ellipse'){
    if(draft.pts.length===1){guide(draft.pts[0],c);}
    else if(draft.pts.length===2){const cc=draft.pts[0];
      guide(cc,c);ent({type:'line',pts:[cc,c]});
      const v={x:draft.pts[1].x-cc.x,y:draft.pts[1].y-cc.y};const rr=Math.hypot(v.x,v.y)||1e-9;
      const u={x:v.x/rr,y:v.y/rr};const dd={x:c.x-cc.x,y:c.y-cc.y};
      const ry=Math.abs(dd.x*u.y-dd.y*u.x);
      ent({type:'ellipse',pts:[cc],rx:rr,ry:Math.max(0.01,ry),rot:Math.atan2(u.y,u.x)});}}
  else if(tool==='pline'&&draft.pts.length>=1){
    if(draft.pts.length>=2)ent({type:'pline',pts:draft.pts.concat([c]),closed:false});
    else guide(draft.pts[0],c);
    if(draft.pts.length>=3&&dist(c,draft.pts[0])*view.scale<9){
      const sc=W2S(draft.pts[0].x,draft.pts[0].y);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.strokeStyle=ACCENT;ctx.lineWidth=1.4;ctx.strokeRect(sc.x-5,sc.y-5,10,10);
      ctx.setTransform(view.scale*dpr,0,0,-view.scale*dpr,view.ox*dpr,view.oy*dpr);}}
  else if(tool==='dim'){
    if(draft.pts.length===1){guide(draft.pts[0],c);}
    else if(draft.pts.length===2){
      const p1=draft.pts[0],p2=draft.pts[1];
      let ux=p2.x-p1.x,uy=p2.y-p1.y;const l=Math.hypot(ux,uy)||1e-9;ux/=l;uy/=l;
      const nx=-uy,ny=ux,mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;

}

/* ---------- 夹点 ---------- */
function gripsOf(e){
  const g=[];const A=(pt,kind,idx)=>g.push({e,pt,kind,idx,key:e.id+':'+kind+':'+idx});
  if(e.type==='line'||e.type==='rect'||e.type==='text')
    e.pts.forEach((p,i)=>A({x:p.x,y:p.y},'pt',i));
  else if(e.type==='pline')e.pts.forEach((p,i)=>A({x:p.x,y:p.y},'pt',i));
  else if(e.type==='circle'){A({x:e.pts[0].x,y:e.pts[0].y},'pt',0);
    for(let k=0;k<4;k++){const a=k*Math.PI/2;
      A({x:e.pts[0].x+e.r*Math.cos(a),y:e.pts[0].y+e.r*Math.sin(a)},'r',k);}}
  else if(e.type==='arc'){const c=e.pts[0];
    A({x:c.x,y:c.y},'pt',0);
    A({x:c.x+e.r*Math.cos(e.a0),y:c.y+e.r*Math.sin(e.a0)},'a0',0);
    A({x:c.x+e.r*Math.cos(e.a1),y:c.y+e.r*Math.sin(e.a1)},'a1',0);
    {const m=(e.a0+e.a1)/2;A({x:c.x+e.r*Math.cos(m),y:c.y+e.r*Math.sin(m)},'rmid',0);}}
  else if(e.type==='ellipse'){const c=e.pts[0],r=e.rot||0;
    A({x:c.x,y:c.y},'pt',0);
    A({x:c.x+e.rx*Math.cos(r),y:c.y+e.rx*Math.sin(r)},'rx',0);
    A({x:c.x-e.ry*Math.sin(r),y:c.y+e.ry*Math.cos(r)},'ry',0);}
  else if(e.type==='dim'){const d=dimGeom(e);
    e.pts.forEach((p,i)=>A({x:p.x,y:p.y},'pt',i));
    A({x:(d.A.x+d.B.x)/2,y:(d.A.y+d.B.y)/2},'off',-1);}
  return g;}
function gripAt(sp){
  if(tool!=='select'||!sel.size)return null;
  for(const e of selEnts()){if(!editable(e))continue;
    for(const gr of gripsOf(e)){const s=W2S(gr.pt.x,gr.pt.y);
      if(Math.abs(s.x-sp.x)<=6&&Math.abs(s.y-sp.y)<=6)return gr;}}
  return null;}function applyGrip(gr,p){
  const e=gr.e;
  switch(gr.kind){
    case'pt':e.pts[gr.idx]={x:p.x,y:p.y};break;
    case'r':e.r=Math.max(0.01,dist(e.pts[0],p));break;
    case'rmid':e.r=Math.max(0.01,dist(e.pts[0],p));break;
    case'a0':{e.r=Math.max(0.01,dist(e.pts[0],p));
      const a=Math.atan2(p.y-e.pts[0].y,p.x-e.pts[0].x);
      e.a0=a;while(e.a1<=e.a0+0.02)e.a1+=2*Math.PI;
      while(e.a1-e.a0>2*Math.PI-0.02)e.a1-=2*Math.PI;break;}
    case'a1':{e.r=Math.max(0.01,dist(e.pts[0],p));
      const a=Math.atan2(p.y-e.pts[0].y,p.x-e.pts[0].x);
      let na=a;while(na<=e.a0+0.02)na+=2*Math.PI;
      if(na-e.a0<2*Math.PI-0.02)e.a1=na;break;}
    case'rx':{const v={x:p.x-e.pts[0].x,y:p.y-e.pts[0].y};
      e.rot=Math.atan2(v.y,v.x);e.rx=Math.max(0.01,Math.hypot(v.x,v.y));break;}
    case'ry':{const r=e.rot||0,u={x:Math.cos(r),y:Math.sin(r)},v={x:p.x-e.pts[0].x,y:p.y-e.pts[0].y};
      e.ry=Math.max(0.01,Math.abs(v.x*u.y-v.y*u.x));break;}
    case'off':{const d=dimGeom(e);const mx=(d.A.x+d.B.x)/2,my=(d.A.y+d.B.y)/2;
      e.off=(p.x-mx)*d.nx+(p.y-my)*d.ny;break;}
  }}

const snapState=()=>JSON.stringify({entities:doc.entities,layers:doc.layers,seq:doc.seq,activeLayer:doc.activeLayer,settings});
function pushHistory(){hist.push(snapState());if(hist.length>90)hist.shift();fut.length=0;autosave();}

const TOOLNAME={select:'选择',pan:'平移',line:'直线',pline:'多段线',rect:'矩形',circle:'圆',arc:'圆弧',ellipse:'椭圆',text:'文字',dim:'标注'};
const TOOLHINT={
  select:'单击选择 · 框选 · 拖动移动 · 双击文字编辑 · 夹点拖拽修改',
  pan:'按住拖动平移 · 滚轮缩放',
  line:'单击起点与终点 · 正交 F8 · Esc 取消',
  pline:'单击加点 · Enter / 双击结束 · C 或捕捉起点闭合',
  rect:'单击对角两点（或按住拖拽）',
  circle:'单击圆心与半径点（或按住拖拽）',
  arc:'依次单击圆心 → 起点 → 终点（逆时针）',
  ellipse:'圆心 → 半长轴端点 → 定短轴',
  text:'单击放置位置，输入后 Enter 确认',
  dim:'依次单击两个测量点，再点偏移侧'};
const TOOLKEY={select:'Esc',pan:'H',line:'L',pline:'P',rect:'R',circle:'C',arc:'A',ellipse:'E',text:'T',dim:'D'};

function setTool(t){
  if(t!==tool){draft=null;curSnap=null;}
  tool=t;
  $$('#rail .tool').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  $('#stool').textContent=TOOLNAME[t]+(TOOLKEY[t]?' · '+TOOLKEY[t]:'');
  $('#thint').textContent=TOOLHINT[t];
  cv.style.cursor=t==='pan'?'grab':'none';
  requestRender();}

function commitLine(a,b){if(dist(a,b)<1e-9)return;
  pushHistory();addEnt({type:'line',pts:[{...a},{...b}]});afterCommit();}
function commitRect(a,b){if(Math.abs(a.x-b.x)<1e-9&&Math.abs(a.y-b.y)<1e-9)return;
  pushHistory();addEnt({type:'rect',pts:[{...a},{...b}]});afterCommit();}
function commitCircle(c,p){const r=dist(c,p);if(r<1e-9)return;
  pushHistory();addEnt({type:'circle',pts:[{...c}],r});afterCommit();}
function commitArc(){const[c,s,e]=draft.pts;const r=dist(c,s);if(r<1e-9)return;
  let a0=Math.atan2(s.y-c.y,s.x-c.x),a1=Math.atan2(e.y-c.y,e.x-c.x);
  while(a1<=a0)a1+=2*Math.PI;
  const span=a1-a0;
  if(span<=0.02){draft=null;return;}
  pushHistory();
  if(span>2*Math.PI-0.02)addEnt({type:'circle',pts:[{...c}],r});
  else addEnt({type:'arc',pts:[{...c}],r,a0,a1});
  afterCommit();}
function commitEllipse(){const[c,a,b]=draft.pts;
  const v={x:a.x-c.x,y:a.y-c.y};const rx=Math.hypot(v.x,v.y);if(rx<1e-9)return;
  const u={x:v.x/rx,y:v.y/rx};const dd={x:b.x-c.x,y:b.y-c.y};
  const ry=Math.abs(dd.x*u.y-dd.y*u.x);
  pushHistory();addEnt({type:'ellipse',pts:[{...c}],rx,ry:Math.max(0.01,ry),rot:Math.atan2(u.y,u.x)});afterCommit();}
function commitDim(){const[p1,p2,p3]=draft.pts;if(dist(p1,p2)<1e-9)return;
  let ux=p2.x-p1.x,uy=p2.y-p1.y;const l=Math.hypot(ux,uy)||1e-9;ux/=l;uy/=l;
  const nx=-uy,ny=ux,mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
  let off=(p3.x-mx)*nx+(p3.y-my)*ny;
  if(Math.abs(off)<1)off=(off<0?-1:1)*10;
  pushHistory();addEnt({type:'dim',pts:[{...p1},{...p2}],off,ts:settings.dimTs});afterCommit();}
function commitPline(close){if(draft.pts.length<2)return;
  pushHistory();addEnt({type:'pline',pts:draft.pts.map(p=>({...p})),closed:!!close});afterCommit();}
function afterCommit(){draft=null;renderTitle();requestRender();autosave();}

function advanceTo(wp){
  switch(tool){
    case'line':commitLine(draft.pts[0],wp);break;
    case'rect':commitRect(draft.pts[0],wp);break;
    case'circle':commitCircle(draft.pts[0],wp);break;
    case'arc':draft.pts.push({...wp});if(draft.pts.length===3)commitArc();break;
    case'ellipse':draft.pts.push({...wp});if(draft.pts.length===3)commitEllipse();break;
    case'dim':draft.pts.push({...wp});if(draft.pts.length===3)commitDim();break;
  }}
const DRAG_TOOLS={line:1,rect:1,circle:1};

function evPos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

function onDown(e){
  const sp=evPos(e);mouseS=sp;mouseDownS={...sp};mouseOn=true;
  if($('#tedit').style.display==='block'&&e.target!==$('#tedit'))commitTedit();
  if(e.button===1||(spaceDown&&e.button===0)){startPan(sp,e);e.preventDefault();return;}
  if(e.button!==0)return;
  if(tool==='pan'){startPan(sp,e);return;}
  if(tool==='select'){
    const gr=gripAt(sp);
    if(gr){drag={kind:'grip',gr,gk:gr.key,pushed:false,s0:sp};return;}
    const raw=S2W(sp.x,sp.y);const hit=hitTop(raw);
    if(hit){
      if(!sel.has(hit.id)){
        if(!e.shiftKey)sel.clear();
        sel.add(hit.id);renderProps();}
      else if(e.shiftKey){sel.delete(hit.id);renderProps();requestRender();return;}
      drag={kind:'move',s0:sp,w0:raw,orig:selEnts().map(en=>({id:en.id,pts:en.pts.map(p=>({...p}))})),pushed:false};
    }else{
      if(!e.shiftKey)sel.clear();
      drag={kind:'rubber',s0:sp,add:e.shiftKey};
      renderProps();requestRender();
    }
    return;}
  // 绘制工具
  const anchor=draft&&draft.pts.length?draft.pts[draft.pts.length-1]:null;
  const wp=applySnapOrtho(S2W(sp.x,sp.y),anchor);
  curWp=wp;
  if(tool==='text'){openTedit(sp,wp,null);return;}
  if(tool==='pline'){
    if(!draft)draft={pts:[]};
    if(draft.pts.length>=3&&dist(wp,draft.pts[0])*view.scale<9){commitPline(true);return;}
    if(!draft.pts.length||dist(wp,draft.pts[draft.pts.length-1])>1e-9)draft.pts.push({...wp});
    requestRender();return;}
  if(!draft)draft={pts:[{...wp}],anchorDown:true};
  else advanceTo(wp);
  requestRender();}

function onMove(e){
  const sp=evPos(e);mouseS=sp;mouseOn=true;
  if(drag){
    if(drag.kind==='pan'){
      view.ox+=sp.x-drag.s0.x;view.oy+=sp.y-drag.s0.y;drag.s0=sp;
      updateStatusZoom();requestRender();return;}
    if(drag.kind==='rubber'){updateDraftInfo();requestRender();return;}
    if(drag.kind==='move'){
      let w1=S2W(sp.x,sp.y);
      if(settings.ortho){const dx=w1.x-drag.w0.x,dy=w1.y-drag.w0.y;
        if(Math.abs(dx)>Math.abs(dy))w1={x:w1.x,y:drag.w0.y};else w1={x:drag.w0.x,y:w1.y};}
      const dx=w1.x-drag.w0.x,dy=w1.y-drag.w0.y;
      if(!drag.pushed&&(Math.abs(dx)>1e-6||Math.abs(dy)>1e-6)){pushHistory();drag.pushed=true;}
      if(drag.pushed)for(const o of drag.orig){const en=byId(o.id);if(!en)continue;
        en.pts=o.pts.map((p,i)=>({x:p.x+dx,y:p.y+dy}));}
      updateDraftInfo(dx,dy);requestRender();return;}
    if(drag.kind==='grip'){
      const raw=S2W(sp.x,sp.y);
      const p=applySnapOrtho(raw,null);
      if(!drag.pushed){pushHistory();drag.pushed=true;}
      applyGrip(drag.gr,p);requestRender();return;}
    return;}
  // 悬停与捕捉
  const raw=S2W(sp.x,sp.y);
  if(tool==='select'){
    curSnap=null;
    const gh=gripAt(sp);
    gripHover=gh?gh.key:null;
    if(!gh){const h=hitTop(raw);hoverId=h?h.id:null;}
    else hoverId=null;
    cv.style.cursor='none';
  }else{
    const anchor=draft&&draft.pts.length?draft.pts[draft.pts.length-1]:null;
    curWp=applySnapOrtho(raw,anchor);
    hoverId=null;gripHover=null;
  }
  updateXY(raw);updateDraftInfo();requestRender();}

function onUp(e){
  if(drag&&drag.kind==='pan'){drag=null;
    cv.style.cursor=spaceDown||tool==='pan'?'grab':'none';
    saveViewDeb();return;}
  if(e.button===1)return;
  const sp=evPos(e);
  if(!drag){
    // 绘制工具：按住拖拽后松开 = 直接以当前点成图
    if(draft&&draft.anchorDown&&DRAG_TOOLS[tool]&&mouseDownS&&dist(mouseDownS,sp)>5){
      draft.anchorDown=false;
      advanceTo(curWp);}
    updateDraftInfo();
    return;}
  if(drag.kind==='rubber'){
    const a=drag.s0,b=sp;
    const w=Math.abs(a.x-b.x),h=Math.abs(a.y-b.y);
    if(w>3||h>3){
      const r1=S2W(Math.min(a.x,b.x),Math.max(a.y,b.y));
      const r2=S2W(Math.max(a.x,b.x),Math.min(a.y,b.y));
      const rect={minx:r1.x,miny:r1.y,maxx:r2.x,maxy:r2.y};
      const crossing=b.x<a.x; // 右→左 = 栏选（交叉）
      for(const en of visibleEnts()){
        if(!editable(en))continue;
        const bb=entBBox(en);if(!bb)continue;
        const inside=bb.minx>=rect.minx&&bb.maxx<=rect.maxx&&bb.miny>=rect.miny&&bb.maxy<=rect.maxy;
        const cross=bb.minx<=rect.maxx&&bb.maxx>=rect.minx&&bb.miny<=rect.maxy&&bb.maxy>=rect.miny;
        if(inside||crossing&&cross)sel.add(en.id);}
      renderProps();}
    drag=null;requestRender();return;}
  if(drag.kind==='move'){drag=null;renderProps();renderTitle();autosave();requestRender();return;}
  if(drag.kind==='grip'){drag=null;renderProps();autosave();requestRender();return;}
  updateDraftInfo();}

function startPan(sp,e){drag={kind:'pan',s0:{...sp}};cv.style.cursor='grabbing';}

/* ---------- 键盘 ---------- */
let lastNudge=0;
window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key===' '){spaceDown=true;if(!drag)cv.style.cursor='grab';e.preventDefault();return;}
  const k=e.key.toLowerCase();
  if(e.ctrlKey||e.metaKey){
    switch(k){
      case'z':e.preventDefault();e.shiftKey?redo():undo();return;
      case'y':e.preventDefault();redo();return;
      case'a':e.preventDefault();sel.clear();
        for(const en of visibleEnts())if(editable(en))sel.add(en.id);
        renderProps();requestRender();return;
      case'c':e.preventDefault();copySel();return;
      case'x':e.preventDefault();copySel();deleteSel();return;
      case'v':e.preventDefault();pasteClip();return;
      case'd':e.preventDefault();copySel();pasteClip();return;
      case's':e.preventDefault();exportJSON();return;
      case'o':e.preventDefault();$('#file').click();return;
    }return;}
  if(e.key==='F3'){e.preventDefault();settings.osnap=!settings.osnap;syncToggleUI();return;}
  if(e.key==='F7'){e.preventDefault();settings.gridshow=!settings.gridshow;syncToggleUI();requestRender();return;}
  if(e.key==='F8'){e.preventDefault();settings.ortho=!settings.ortho;syncToggleUI();return;}
  if(e.key==='F9'){e.preventDefault();settings.gsnap=!settings.gsnap;syncToggleUI();return;}
  if(e.key==='Escape'){
    if(draft){draft=null;requestRender();return;}
    if(sel.size){sel.clear();renderProps();requestRender();return;}
    setTool('select');return;}
  if(e.key==='Enter'){
    if(tool==='pline'&&draft&&draft.pts.length>=2){commitPline(false);}return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();return;}
  if(e.key.startsWith('Arrow')&&sel.size){
    e.preventDefault();
    const step=gridStep()*(e.shiftKey?10:1);
    let dx=0,dy=0;
    if(e.key==='ArrowLeft')dx=-step;if(e.key==='ArrowRight')dx=step;
    if(e.key==='ArrowUp')dy=step;if(e.key==='ArrowDown')dy=-step;
    if(Date.now()-lastNudge>800)pushHistory();
    lastNudge=Date.now();
    for(const en of selEnts())translateEnt(en,dx,dy);
    requestRender();autosave();return;}
  if(e.key==='+'||e.key==='=')return zoomAt(CW/2,CH/2,1.25);
  if(e.key==='-')return zoomAt(CW/2,CH/2,0.8);
  if(k==='0'){view.scale=1;view.ox=CW/2;view.oy=CH/2;updateStatusZoom();requestRender();saveViewDeb();return;}
  if(k==='f'){fitView();return;}
  if(k==='c'&&tool==='pline'&&draft&&draft.pts.length>=3){commitPline(true);return;}
  const map={v:'select',h:'pan',l:'line',p:'pline',r:'rect',c:'circle',a:'arc',e:'ellipse',t:'text',d:'dim'};
  if(map[k])setTool(map[k]);});
window.addEventListener('keyup',e=>{
  if(e.key===' '){spaceDown=false;if(!drag)cv.style.cursor=tool==='pan'?'grab':'none';}});

function copySel(){const es=selEnts();if(!es.length)return toast('未选择实体');
  clipboard=JSON.stringify(es.map(e=>JSON.parse(JSON.stringify(e))));toast('已复制 '+es.length+' 个实体');}
function pasteClip(){
  if(!clipboard)return toast('剪贴板为空');
  pushHistory();const arr=JSON.parse(clipboard);
  const g=gridStep();const off={x:Math.round(2*g),y:-Math.round(2*g)};
  sel.clear();
  for(const o of arr){o.id='E'+(doc.seq++);o.layer=(L(o.layer)?o.layer:doc.activeLayer);
    for(const p of o.pts){p.x+=off.x;p.y+=off.y;}
    doc.entities.push(o);sel.add(o.id);}
  renderProps();renderTitle();requestRender();autosave();toast('已粘贴 '+arr.length+' 个实体');}
function deleteSel(){const es=selEnts();if(!es.length)return;
  pushHistory();doc.entities=doc.entities.filter(e=>!sel.has(e.id));sel.clear();
  renderProps();renderTitle();requestRender();autosave();}

function updateXY(wp){$('#sxy').textContent='X '+fmt(wp.x)+' · Y '+fmt(wp.y);}
function updateStatusZoom(){$('#szoom').textContent=Math.round(view.scale*100)+'%';
  $('#sgrid').textContent='栅格 '+gridStep();}
function updateDraftInfo(dx,dy){
  const el=$('#sdelta');
  if(drag&&drag.kind==='move'&&dx!==undefined){el.textContent='Δ '+fmt(dx)+', '+fmt(dy);return;}
  if(!draft||!mouseOn){el.textContent='';return;}
  const c=curWp;
  if(tool==='line'||tool==='pline'||tool==='dim'){
    const a=draft.pts[draft.pts.length-1];if(a){
      const d=dist(a,c);const ang=((Math.atan2(c.y-a.y,c.x-a.x)*R2D)%360+360)%360;
      el.textContent='L '+fmt(d)+' ∠'+ang.toFixed(1)+'°';return;}}
  if(tool==='rect'&&draft.pts.length===1){
    const a=draft.pts[0];el.textContent='W '+fmt(Math.abs(c.x-a.x))+' × H '+fmt(Math.abs(c.y-a.y));return;}
  if(tool==='circle'&&draft.pts.length===1){el.textContent='R '+fmt(dist(draft.pts[0],c));return;}
  if(tool==='ellipse'&&draft.pts.length===2){
    const cc=draft.pts[0];const v={x:draft.pts[1].x-cc.x,y:draft.pts[1].y-cc.y};
    const rx=Math.hypot(v.x,v.y)||1e-9;const u={x:v.x/rx,y:v.y/rx};
    const dd={x:c.x-cc.x,y:c.y-cc.y};
    el.textContent='RX '+fmt(rx)+' RY '+fmt(Math.abs(dd.x*u.y-dd.y*u.x));return;}
  el.textContent='';}

function renderLayers(){
  const box=$('#llist');box.innerHTML='';
  doc.layers.forEach(l=>{
    const row=document.createElement('div');
    row.className='lrow'+(l.name===doc.activeLayer?' act':'')+(l.visible?'':' off');
    row.innerHTML='<button class="ldot" title="切换颜色" style="background:'+l.color+'"></button>'
      +'<span class="lname" title="双击重命名">'+esc(l.name)+(l.locked?' 🔒':'')+'</span>'
      +'<button class="lb eye" title="显示/隐藏">'+(l.visible?EYE:EYEOFF)+'</button>'
      +'<button class="lb lk" title="锁定/解锁">'+(l.locked?LOCK:UNLOCK)+'</button>'
      +'<button class="lb del" title="删除图层">✕</button>';
    row.addEventListener('click',e=>{
      if(e.target.closest('.lb')||e.target.closest('.ldot'))return;
      doc.activeLayer=l.name;renderLayers();renderProps();autosave();});
    row.querySelector('.ldot').addEventListener('click',()=>{
      const i=PALETTE.indexOf(l.color);l.color=PALETTE[(i+1)%PALETTE.length];
      renderLayers();requestRender();autosave();});
    row.querySelector('.eye').addEventListener('click',()=>{
      l.visible=!l.visible;renderLayers();requestRender();autosave();});
    row.querySelector('.lk').addEventListener('click',()=>{
      l.locked=!l.locked;if(l.locked)for(const en of selEnts())if(en.layer===l.name)sel.delete(en.id);
      renderLayers();renderProps();requestRender();autosave();});
    row.querySelector('.del').addEventListener('click',()=>{
      if(doc.layers.length<=1)return toast('至少保留一个图层');
      modal('删除图层','实体将移入当前活跃图层，确定删除「'+l.name+'」？',()=>{
        pushHistory();
        doc.entities.forEach(en=>{if(en.layer===l.name)en.layer=doc.activeLayer;});
        doc.layers=doc.layers.filter(x=>x!==l);
        if(doc.activeLayer===l.name)doc.activeLayer=doc.layers[0].name;
        refreshAll();});});
    row.querySelector('.lname').addEventListener('dblclick',()=>{
      const span=row.querySelector('.lname');const old=l.name;
      span.innerHTML='<input type="text" value="'+esc(old)+'">';
      const inp=span.querySelector('input');inp.focus();inp.select();
      const done=()=>{const v=inp.value.trim()||old;
        if(v!==old&&!doc.layers.some(x=>x.name===v)){
          pushHistory();doc.entities.forEach(en=>{if(en.layer===old)en.layer=v;});
          if(doc.activeLayer===old)doc.activeLayer=v;l.name=v;}
        renderLayers();renderProps();autosave();};
      inp.addEventListener('blur',done);
      inp.addEventListener('keydown',ev=>{ev.stopPropagation();
        if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.value=old;inp.blur();}});});
    box.appendChild(row);});}

/* ---------- 属性面板 ---------- */
function renderProps(){
  const box=$('#props');
  const es=selEnts();
  const layerSel=(cur)=>{
    let h='<select data-k="layer">';
    for(const l of doc.layers)h+='<option value="'+esc(l.name)+'"'+(l.name===cur?' selected':'')+'>'+esc(l.name)+'</option>';
    return h+'</select>';};
  const num=(label,k,v,step)=>'<div class="frow"><label>'+label+'</label><input type="number" step="'+(step||'any')+'" data-k="'+k+'" value="'+v+'"></div>';
  const ro=(label,v)=>'<div class="frow"><label>'+label+'</label><input class="ro" readonly value="'+v+'"></div>';
  const ops=('<div class="ops">'
    +'<button class="btn" data-act="del">删除</button>'
    +'<button class="btn" data-act="dup">复制</button>'
    +'<button class="btn" data-act="rot90">旋转90°</button>'
    +'<button class="btn" data-act="mirH">镜像 ↔</button>'
    +'<button class="btn" data-act="mirV">镜像 ↕</button></div>');

  if(es.length===0){
    box.innerHTML='<div class="ptitle">绘图默认 · DEFAULTS</div>'
      +'<div class="frow"><label>当前图层</label>'+layerSel(doc.activeLayer)+'</div>'
      +num('栅格间距','set:grid',settings.grid)
      +num('文字高度','set:textH',settings.textH)
      +num('标注字高','set:dimTs',settings.dimTs)
      +'<div class="note">快捷键：F3 捕捉 · F8 正交 · F9 格捕 · F7 栅格 · F 适合视图<br>L 线 P 多段线 R 矩形 C 圆 A 弧 E 椭圆 T 文字 D 标注</div>';
    bindProps(box,false);return;}

  if(es.length>1){
    box.innerHTML='<div class="ptitle">已选 '+es.length+' 个实体</div>'
      +'<div class="frow"><label>图层</label>'+layerSel(es[0].layer)+'</div>'+ops;
    bindProps(box,true);return;}

  const e=es[0];
  let h='<div class="ptitle">'+typeName(e.type)+' · '+esc(e.id)+'</div>'
    +'<div class="frow"><label>图层</label>'+layerSel(e.layer)+'</div>';
  switch(e.type){
    case'line':{
      const a=e.pts[0],b=e.pts[1];
      h+=num('X1','x1',fmt4(a.x))+num('Y1','y1',fmt4(a.y))
        +num('X2','x2',fmt4(b.x))+num('Y2','y2',fmt4(b.y))
        +ro('长度',fmt(entLength(e)))
        +ro('角度',((((Math.atan2(b.y-a.y,b.x-a.x)*R2D)%360)+360)%360).toFixed(1)+'°');break;}
    case'rect':{
      const a=e.pts[0],b=e.pts[1];
      h+=num('X','x',fmt4(Math.min(a.x,b.x)))+num('Y','y',fmt4(Math.min(a.y,b.y)))
        +num('宽','w',fmt4(Math.abs(b.x-a.x)))+num('高','h',fmt4(Math.abs(b.y-a.y)))
        +ro('周长',fmt(entLength(e)))+ro('面积',fmt(entArea(e)));break;}
    case'pline':{
      h+=ro('顶点数',e.pts.length)+ro('长度',fmt(entLength(e)));
      const a=entArea(e);if(a!==null)h+=ro('面积',fmt(a));
      h+='<div class="ops"><button class="btn" data-act="plclose">'+(e.closed?'打开':'闭合')+'</button></div>';break;}
    case'circle':{
      const c=e.pts[0];
      h+=num('圆心X','cx',fmt4(c.x))+num('圆心Y','cy',fmt4(c.y))+num('半径','r',fmt4(e.r))
        +ro('直径',fmt(e.r*2));break;}
    case'arc':{
      const c=e.pts[0];
      h+=num('圆心X','cx',fmt4(c.x))+num('圆心Y','cy',fmt4(c.y))+num('半径','r',fmt4(e.r))
        +num('起始角°','a0',(e.a0*R2D).toFixed(1))+num('终止角°','a1',(e.a1*R2D).toFixed(1))
        +ro('弧长',fmt(entLength(e)))+ro('圆心角°',((e.a1-e.a0)*R2D).toFixed(1));break;}
    case'ellipse':{
      const c=e.pts[0];
      h+=num('圆心X','cx',fmt4(c.x))+num('圆心Y','cy',fmt4(c.y))
        +num('长半轴','rx',fmt4(e.rx))+num('短半轴','ry',fmt4(e.ry))
        +num('倾角°','rot',((e.rot||0)*R2D).toFixed(1))+ro('周长≈',fmt(entLength(e)));break;}
    case'text':{
      const p=e.pts[0];
      h+='<div class="frow"><label>内容</label><input type="text" data-k="text" value="'+esc(e.text)+'"></div>'
        +num('X','cx',fmt4(p.x))+num('Y','cy',fmt4(p.y))
        +num('字高','size',fmt4(e.size))+num('角度°','rot',((e.rot||0)*R2D).toFixed(1));break;}
    case'dim':{
      h+=ro('测量值',fmt(dist(e.pts[0],e.pts[1])))
        +num('偏移','off',fmt4(e.off||0))+num('字高','ts',fmt4(e.ts||settings.dimTs));break;}
  }
  h+=ops;
  box.innerHTML=h;
  bindProps(box,true);}

function fmt4(v){return String(Math.round(v*10000)/10000);}
function typeName(t){return({line:'直线',pline:'多段线',rect:'矩形',circle:'圆',arc:'圆弧',ellipse:'椭圆',text:'文字',dim:'标注'})[t]||t;}

function bindProps(box,isEnt){
  box.querySelectorAll('input,select').forEach(inp=>{
    inp.addEventListener('focus',()=>{inp._pushed=false;});
    inp.addEventListener('input',()=>{
      if(!inp._pushed){if(isEnt)pushHistory();else inp._pushed=true;if(isEnt)inp._pushed=true;}
      applyProp(inp,isEnt);});
    inp.addEventListener('change',()=>{inp._pushed=false;
      applyProp(inp,isEnt);autosave();renderTitle();requestRender();});});
  box.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
    const act=b.dataset.act;
    if(act==='del')deleteSel();
    else if(act==='dup'){copySel();pasteClip();}
    else if(act==='rot90')rot90Sel();
    else if(act==='mirH')mirrorSel('h');
    else if(act==='mirV')mirrorSel('v');
    else if(act==='plclose'){const e=selEnts()[0];if(e&&e.type==='pline'){
      pushHistory();e.closed=!e.closed;refreshAll();}}}));}

function applyProp(inp,isEnt){
  const k=inp.dataset.k;if(!k)return;
  if(k.startsWith('set:')){
    const v=Math.max(0.01,parseFloat(inp.value)||0);
    settings[k.slice(4)]=v;syncToggleUI();requestRender();autosave();return;}
  const e=selEnts()[0];if(!e||!isEnt)return;
  const sv=inp.value;
  if(k==='layer'){e.layer=sv;renderLayers();requestRender();return;}
  if(k==='text'){e.text=sv;requestRender();return;}
  const v=parseFloat(sv);if(isNaN(v))return;
  switch(k){
    case'x1':e.pts[0].x=v;break;case'y1':e.pts[0].y=v;break;
    case'x2':e.pts[1].x=v;break;case'y2':e.pts[1].y=v;break;
    case'x':case'y':case'w':case'h':{
      const a=e.pts[0],b=e.pts[1];
      const x0=Math.min(a.x,b.x),y0=Math.min(a.y,b.y);
      if(k==='x'){const dx=v-x0;e.pts[0].x+=dx;e.pts[1].x+=dx;}
      if(k==='y'){const dy=v-y0;e.pts[0].y+=dy;e.pts[1].y+=dy;}
      if(k==='w'){const sx=b.x>=a.x?1:-1;e.pts[1].x=e.pts[0].x+sx*Math.max(0.01,v);}
      if(k==='h'){const sy=b.y>=a.y?1:-1;e.pts[1].y=e.pts[0].y+sy*Math.max(0.01,v);}
      break;}
    case'cx':e.pts[0].x=v;break;case'cy':e.pts[0].y=v;break;
    case'r':e.r=Math.max(0.01,v);break;
    case'a0':{e.a0=v*D2R;while(e.a1<=e.a0)e.a1+=2*Math.PI;break;}
    case'a1':{let a=v*D2R;while(a<=e.a0)a+=2*Math.PI;e.a1=a;break;}
    case'rx':e.rx=Math.max(0.01,v);break;case'ry':e.ry=Math.max(0.01,v);break;
    case'rot':e.rot=v*D2R;break;
    case'size':e.size=Math.max(1,v);break;
    case'off':e.off=v;break;
    case'ts':e.ts=Math.max(1,v);break;}
  requestRender();}

function download(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());}

function exportJSON(){
  const data=JSON.stringify({app:'concrete-cad',version:1,unit:'mm',filename,
    layers:doc.layers,entities:doc.entities,seq:doc.seq,activeLayer:doc.activeLayer,settings},null,1);
  download('ccad-'+stamp()+'.json',new Blob([data],{type:'application/json'}));
  toast('已导出工程文件（JSON）');}

function exportSVG(){
  const ents=visibleEnts();if(!ents.length)return toast('没有可导出的实体');
  const bb=allBBox(ents);
  const m=Math.max(bb.maxx-bb.minx,bb.maxy-bb.miny)*0.06+2;
  const x0=bb.minx-m,y0=-(bb.maxy+m),w=(bb.maxx-bb.minx)+2*m,h=(bb.maxy-bb.miny)+2*m;
  const sw=clamp(Math.max(w,h)/500,0.2,4);
  const F=v=>String(+(v.toFixed(4)));
  let s='<?xml version="1.0" encoding="UTF-8"?>\n';
  s+='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+F(x0)+' '+F(y0)+' '+F(w)+' '+F(h)+'" width="'+F(w)+'mm" height="'+F(h)+'mm">\n';
  s+='<rect x="'+F(x0)+'" y="'+F(y0)+'" width="'+F(w)+'" height="'+F(h)+'" fill="'+PAPER+'"/>\n';
  const byLayer={};for(const e of ents)(byLayer[e.layer]=byLayer[e.layer]||[]).push(e);
  for(const ln in byLayer){
    const color=Lc(ln);
    s+='<g id="'+esc(ln)+'" stroke="'+color+'" stroke-width="'+F(sw)+'" fill="none" stroke-linecap="square" font-family="Consolas,monospace">\n';
    for(const e of byLayer[ln]){
      switch(e.type){
        case'line':s+='<line x1="'+F(e.pts[0].x)+'" y1="'+F(-e.pts[0].y)+'" x2="'+F(e.pts[1].x)+'" y2="'+F(-e.pts[1].y)+'"/>\n';break;
        case'rect':{const a=e.pts[0],b=e.pts[1];
          s+='<rect x="'+F(Math.min(a.x,b.x))+'" y="'+F(-Math.max(a.y,b.y))+'" width="'+F(Math.abs(b.x-a.x))+'" height="'+F(Math.abs(b.y-a.y))+'"/>\n';break;}
        case'pline':{
          const pts=e.pts.map(p=>F(p.x)+','+F(-p.y)).join(' ');
          if(e.closed)s+='<polygon points="'+pts+'"/>\n';
          else s+='<polyline points="'+pts+'"/>\n';
          break;}
        case'circle':s+='<circle cx="'+F(e.pts[0].x)+'" cy="'+F(-e.pts[0].y)+'" r="'+F(e.r)+'"/>\n';break;
        case'arc':{const c=e.pts[0];
          const sx=c.x+e.r*Math.cos(e.a0),sy=c.y+e.r*Math.sin(e.a0);
          const ex=c.x+e.r*Math.cos(e.a1),ey=c.y+e.r*Math.sin(e.a1);
          const laf=(e.a1-e.a0)>Math.PI?1:0;
          s+='<path d="M '+F(sx)+' '+F(-sy)+' A '+F(e.r)+' '+F(e.r)+' 0 '+laf+' 0 '+F(ex)+' '+F(-ey)+'"/>\n';break;}
        case'ellipse':s+='<ellipse cx="'+F(e.pts[0].x)+'" cy="'+F(-e.pts[0].y)+'" rx="'+F(e.rx)+'" ry="'+F(e.ry)+'" transform="rotate('+F(-(e.rot||0)*R2D)+' '+F(e.pts[0].x)+' '+F(-e.pts[0].y)+')"/>\n';break;
        case'text':s+='<text x="0" y="0" transform="translate('+F(e.pts[0].x)+','+F(-e.pts[0].y)+') rotate('+F(-(e.rot||0)*R2D)+')" font-size="'+F(e.size)+'" fill="'+color+'" stroke="none">'+esc(e.text)+'</text>\n';break;
        case'dim':{const d=dimGeom(e),ts=e.ts||settings.dimTs,ext=0.35*ts;
          const L2=(a,b)=>'<line x1="'+F(a.x)+'" y1="'+F(-a.y)+'" x2="'+F(b.x)+'" y2="'+F(-b.y)+'"/>\n';
          s+=L2(e.pts[0],{x:d.A.x+d.nx*ext,y:d.A.y+d.ny*ext});
          s+=L2(e.pts[1],{x:d.B.x+d.nx*ext,y:d.B.y+d.ny*ext});
          s+=L2(d.A,d.B);
          const al=0.7*ts,aw=0.18*ts;
          const tri=(t,dx,dy)=>'<polygon points="'+F(t.x)+','+F(-t.y)+' '+F(t.x+dx*al-dy*aw)+','+F(-(t.y+dy*al+dx*aw))+' '+F(t.x+dx*al+dy*aw)+','+F(-(t.y+dy*al-dx*aw))+'" fill="'+color+'" stroke="none"/>\n';
          s+=tri(d.A,-d.ux,-d.uy)+tri(d.B,d.ux,d.uy);
          let ang=d.ang;const deg=((ang*R2D)%360+360)%360;
          if(deg>90&&deg<=270)ang+=Math.PI;
          const mx=(d.A.x+d.B.x)/2+d.nx*0.45*ts,my=(d.A.y+d.B.y)/2+d.ny*0.45*ts;
          s+='<text transform="translate('+F(mx)+','+F(-my)+') rotate('+F(-ang*R2D)+')" font-size="'+F(ts)+'" fill="'+color+'" stroke="none" text-anchor="middle">'+fmt(d.L)+'</text>\n';
          break;}
      }}
    s+='</g>\n';}
  s+='</svg>';
  download('ccad-'+stamp()+'.svg',new Blob([s],{type:'image/svg+xml'}));
  toast('已导出 SVG（'+ents.length+' 个实体）');}

function exportDXF(){
  const ents=visibleEnts();if(!ents.length)return toast('没有可导出的实体');
  const P=[];
  const put=(c,v)=>{P.push(String(c),String(v));};
  put(0,'SECTION');put(2,'HEADER');
  put(9,'$ACADVER');put(1,'AC1009');
  put(9,'$INSUNITS');put(70,4);
  put(0,'ENDSEC');
  put(0,'SECTION');put(2,'TABLES');
  put(0,'TABLE');put(2,'LAYER');put(70,doc.layers.length);
  for(const l of doc.layers){put(0,'LAYER');put(2,l.name);put(70,0);
    put(62,ACI[l.color]||7);put(6,'CONTINUOUS');}
  put(0,'ENDTAB');put(0,'ENDSEC');
  put(0,'SECTION');put(2,'ENTITIES');
  const f=v=>v.toFixed(6);
  for(const e of ents){
    const lay=e.layer;
    switch(e.type){
      case'line':put(0,'LINE');put(8,lay);
        put(10,f(e.pts[0].x));put(20,f(e.pts[0].y));
        put(11,f(e.pts[1].x));put(21,f(e.pts[1].y));break;
      case'circle':put(0,'CIRCLE');put(8,lay);
        put(10,f(e.pts[0].x));put(20,f(e.pts[0].y));put(40,f(e.r));break;
      case'arc':put(0,'ARC');put(8,lay);
        put(10,f(e.pts[0].x));put(20,f(e.pts[0].y));put(40,f(e.r));
        put(50,f(e.a0*R2D));put(51,f(e.a1*R2D));break;
      case'text':put(0,'TEXT');put(8,lay);
        put(10,f(e.pts[0].x));put(20,f(e.pts[0].y));
        put(40,f(e.size));put(1,e.text);put(50,f((e.rot||0)*R2D));break;
      case'rect':case'pline':case'ellipse':{
        let pts,closed=false;
        if(e.type==='ellipse'){const c=e.pts[0],r=e.rot||0,n=40;pts=[];
          for(let i=0;i<n;i++){const t=i/n*2*Math.PI;
            const lx=e.rx*Math.cos(t),ly=e.ry*Math.sin(t);
            pts.push({x:c.x+lx*Math.cos(r)-ly*Math.sin(r),y:c.y+lx*Math.sin(r)+ly*Math.cos(r)});}
          closed=true;}
        else if(e.type==='rect'){pts=rectCorners(e);closed=true;}
        else{pts=e.pts;closed=!!e.closed;}
        if(pts.length<2)break;
        put(0,'POLYLINE');put(8,lay);put(66,1);put(70,closed?1:0);
        for(const p of pts){put(0,'VERTEX');put(8,lay);
          put(10,f(p.x));put(20,f(p.y));}
        put(0,'SEQEND');break;}
      case'dim':{const d=dimGeom(e),ts=e.ts||settings.dimTs,ext=0.35*ts;
        const line=(a,b)=>{put(0,'LINE');put(8,lay);
          put(10,f(a.x));put(20,f(a.y));put(11,f(b.x));put(21,f(b.y));};
        line(e.pts[0],{x:d.A.x+d.nx*ext,y:d.A.y+d.ny*ext});
        line(e.pts[1],{x:d.B.x+d.nx*ext,y:d.B.y+d.ny*ext});
        line(d.A,d.B);
        const mx=(d.A.x+d.B.x)/2+d.nx*0.45*ts,my=(d.A.y+d.B.y)/2+d.ny*0.45*ts;
        put(0,'TEXT');put(8,lay);
        put(10,f(mx));put(20,f(my));put(40,f(ts));put(1,fmt(d.L));
        put(50,f(d.ang*R2D%360<0?d.ang*R2D+360:d.ang*R2D));
        break;}
    }}
  put(0,'ENDSEC');put(0,'EOF');
  download('ccad-'+stamp()+'.dxf',new Blob([P.join('\r\n')+'\r\n'],{type:'application/dxf'}));
  toast('已导出 DXF R12（'+ents.length+' 个实体）');}

function exportPNG(){
  const ents=visibleEnts();if(!ents.length)return toast('没有可导出的实体');
  const bb=allBBox(ents);
  const m=Math.max(bb.maxx-bb.minx,bb.maxy-bb.miny)*0.08+2;
  const w=(bb.maxx-bb.minx)+2*m,h=(bb.maxy-bb.miny)+2*m;
  const k=clamp(1800/Math.max(w,h),0.05,40);
  const W=Math.round(w*k),H=Math.round(h*k);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  g.setTransform(k,0,0,-k,(-(bb.minx-m))*k,(bb.maxy+m)*k);
  for(const e of ents)drawEnt(g,e,k,Lc(e.layer),1,1.4);
  c.toBlob(bl=>{download('ccad-'+stamp()+'.png',bl);toast('已导出 PNG '+W+'×'+H);},'image/png');}
